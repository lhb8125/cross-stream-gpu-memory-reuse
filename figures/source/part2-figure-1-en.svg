<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
  <title id="title">Baseline, premature hand-back, and schedule-aware hand-back</title>
  <desc id="desc">Three panels compare baseline, premature hand-back, and schedule-aware hand-back. The baseline panel shows original forward and backward dependencies in blue and purple. The later panels omit those repeated edges so the orange premature hand-backs and green schedule-aware hand-backs remain prominent.</desc>
  <defs>
    <marker id="fdep" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52d8ff"/></marker>
    <marker id="bdep" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b38aff"/></marker>
    <marker id="risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#ff9366"/></marker>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#62dcb0"/></marker>
    <pattern id="wait-risk" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#ff9366" stroke-width="4" opacity=".32"/></pattern>
    <pattern id="wait-ok" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#62dcb0" stroke-width="4" opacity=".25"/></pattern>
  </defs>
  <rect width="1200" height="950" rx="28" fill="#081522"/>
  <g font-family="Inter,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="55" y="55" fill="#edf7ff" font-size="26" font-weight="850">Hand-Back Cost Depends on Where the Host Enqueues the Wait</text>
    <text x="55" y="86" fill="#9fb4c8" font-size="15">Boxes follow submodule dependencies; horizontal overlap means work on different streams has no direct dependency</text>

    <!-- Panel 1 -->
    <rect x="45" y="108" width="1110" height="192" rx="18" fill="#0d2032" stroke="#31506b"/>
    <text x="70" y="140" fill="#edf7ff" font-size="19" font-weight="850">1 · Baseline: No Hand-Back Wait</text>
    <text x="1115" y="140" fill="#52d8ff" font-size="15" font-weight="850" text-anchor="end">B MLP ∥ F dispatch preserved</text>
    <text x="70" y="192" fill="#52d8ff" font-size="13" font-weight="850">COMM</text>
    <text x="70" y="257" fill="#b38aff" font-size="13" font-weight="850">COMPUTE</text>
    <line x1="160" y1="187" x2="1110" y2="187" stroke="#284760" stroke-width="2"/>
    <line x1="160" y1="252" x2="1110" y2="252" stroke="#49396b" stroke-width="2"/>
    <rect x="180" y="168" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="247.5" y="193" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B combine</text>
    <rect x="315" y="168" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="382.5" y="193" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F dispatch</text>
    <rect x="495" y="168" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="562.5" y="193" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B dispatch</text>
    <rect x="630" y="168" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="697.5" y="193" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F combine</text>
    <rect x="270" y="233" width="45" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="292.5" y="256" fill="#edf7ff" font-size="8.5" font-weight="750" text-anchor="middle">F attn</text>
    <rect x="315" y="233" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="405" y="258" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B MLP</text>
    <rect x="495" y="233" width="90" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="540" y="258" fill="#edf7ff" font-size="11" font-weight="750" text-anchor="middle">F MLP</text>
    <rect x="630" y="233" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="720" y="258" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B attention</text>
    <path d="M308 233V206" fill="none" stroke="#52d8ff" stroke-width="2.4" marker-end="url(#fdep)"/>
    <path d="M450 187H472V252H495" fill="none" stroke="#52d8ff" stroke-width="2.4" marker-end="url(#fdep)"/>
    <path d="M585 252H607V187H630" fill="none" stroke="#52d8ff" stroke-width="2.4" marker-end="url(#fdep)"/>
    <path d="M322 206V233" fill="none" stroke="#b38aff" stroke-width="2.4" marker-end="url(#bdep)"/>
    <path d="M488 233V206" fill="none" stroke="#b38aff" stroke-width="2.4" marker-end="url(#bdep)"/>
    <path d="M637 206V233" fill="none" stroke="#b38aff" stroke-width="2.4" marker-end="url(#bdep)"/>
    <text x="895" y="242" fill="#9fb4c8" font-size="12">F: attention → dispatch → MLP → combine</text>
    <text x="895" y="265" fill="#9fb4c8" font-size="12">B: combine → MLP → dispatch → attention</text>

    <!-- Panel 2 -->
    <rect x="45" y="320" width="1110" height="248" rx="18" fill="#0d2032" stroke="#ff9366"/>
    <text x="70" y="352" fill="#ffb99f" font-size="19" font-weight="850">2 · Immediate Hand-Back: Early Wait Serializes Overlap</text>
    <text x="1115" y="352" fill="#ff9a6c" font-size="15" font-weight="850" text-anchor="end">B MLP ∦ F dispatch</text>
    <text x="70" y="405" fill="#52d8ff" font-size="13" font-weight="850">COMM</text>
    <text x="70" y="481" fill="#b38aff" font-size="13" font-weight="850">COMPUTE</text>
    <line x1="160" y1="400" x2="1110" y2="400" stroke="#284760" stroke-width="2"/>
    <line x1="160" y1="476" x2="1110" y2="476" stroke="#49396b" stroke-width="2"/>
    <rect x="180" y="381" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="247.5" y="406" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B combine</text>
    <rect x="315" y="381" width="180" height="38" rx="8" fill="url(#wait-risk)" stroke="#ff9366"/><text x="405" y="406" fill="#ffb99f" font-size="12" font-weight="800" text-anchor="middle">wait B MLP</text>
    <rect x="495" y="381" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="562.5" y="406" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F dispatch</text>
    <rect x="630" y="381" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="697.5" y="406" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B dispatch</text>
    <rect x="765" y="381" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="832.5" y="406" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F combine</text>
    <rect x="270" y="457" width="45" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="292.5" y="480" fill="#edf7ff" font-size="8.5" font-weight="750" text-anchor="middle">F attn</text>
    <rect x="315" y="457" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="405" y="482" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B MLP</text>
    <rect x="630" y="457" width="90" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="675" y="482" fill="#edf7ff" font-size="11" font-weight="750" text-anchor="middle">F MLP</text>
    <rect x="720" y="457" width="180" height="38" rx="8" fill="url(#wait-risk)" stroke="#ff9366"/><text x="810" y="482" fill="#ffb99f" font-size="12" font-weight="800" text-anchor="middle">wait F combine</text>
    <rect x="900" y="457" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="990" y="482" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B attention</text>
    <path d="M488 457V419" fill="none" stroke="#ff9366" stroke-width="3" marker-end="url(#risk)"/>
    <path d="M900 400V457" fill="none" stroke="#ff9366" stroke-width="3" marker-end="url(#risk)"/>
    <rect x="202" y="522" width="390" height="29" rx="14.5" fill="#39231f" stroke="#ff9366" opacity=".98"/>
    <text x="397" y="542" fill="#ffb99f" font-size="12" font-weight="800" text-anchor="middle">New wait: B MLP → F dispatch</text>
    <rect x="608" y="522" width="390" height="29" rx="14.5" fill="#39231f" stroke="#ff9366" opacity=".98"/>
    <text x="803" y="542" fill="#ffb99f" font-size="12" font-weight="800" text-anchor="middle">New wait: F combine enqueued too early</text>

    <!-- Panel 3 -->
    <rect x="45" y="588" width="1110" height="270" rx="18" fill="#0d2032" stroke="#4ee3a8"/>
    <text x="70" y="620" fill="#bff7dd" font-size="19" font-weight="850">3 · Schedule-Aware Hand-Back: Launch Overlap First</text>
    <text x="1115" y="620" fill="#62dcb0" font-size="15" font-weight="850" text-anchor="end">baseline critical path restored</text>
    <text x="70" y="671" fill="#52d8ff" font-size="13" font-weight="850">COMM</text>
    <text x="70" y="743" fill="#b38aff" font-size="13" font-weight="850">COMPUTE</text>
    <line x1="160" y1="666" x2="1110" y2="666" stroke="#284760" stroke-width="2"/>
    <line x1="160" y1="738" x2="1110" y2="738" stroke="#49396b" stroke-width="2"/>
    <rect x="180" y="647" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="247.5" y="672" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B combine</text>
    <rect x="315" y="647" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="382.5" y="672" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F dispatch</text>
    <rect x="462" y="647" width="14" height="38" rx="5" fill="url(#wait-ok)" stroke="#62dcb0" stroke-width="2"/>
    <rect x="495" y="647" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="562.5" y="672" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B dispatch</text>
    <rect x="630" y="647" width="135" height="38" rx="8" fill="#153f58" stroke="#52d8ff"/><text x="697.5" y="672" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">F combine</text>
    <rect x="270" y="719" width="45" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="292.5" y="742" fill="#edf7ff" font-size="8.5" font-weight="750" text-anchor="middle">F attn</text>
    <rect x="315" y="719" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="405" y="744" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B MLP</text>
    <rect x="495" y="719" width="90" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="540" y="744" fill="#edf7ff" font-size="11" font-weight="750" text-anchor="middle">F MLP</text>
    <rect x="630" y="719" width="180" height="38" rx="8" fill="#352d56" stroke="#b38aff"/><text x="720" y="744" fill="#edf7ff" font-size="12" font-weight="750" text-anchor="middle">B attention</text>
    <rect x="822" y="719" width="14" height="38" rx="5" fill="url(#wait-ok)" stroke="#62dcb0" stroke-width="2"/>
    <path d="M488 719V700H469V685" fill="none" stroke="#62dcb0" stroke-width="3" marker-end="url(#ok)"/>
    <path d="M765 666V700H829V719" fill="none" stroke="#62dcb0" stroke-width="3" marker-end="url(#ok)"/>
    <path d="M469 685V780H410" fill="none" stroke="#62dcb0" stroke-width="1.8"/>
    <rect x="235" y="780" width="350" height="30" rx="15" fill="#102f2b" stroke="#62dcb0"/>
    <text x="410" y="800" fill="#c5f8df" font-size="12" font-weight="800" text-anchor="middle">wait B MLP: after F dispatch</text>
    <path d="M829 757V780H805" fill="none" stroke="#62dcb0" stroke-width="1.8"/>
    <rect x="620" y="780" width="370" height="30" rx="15" fill="#102f2b" stroke="#62dcb0"/>
    <text x="805" y="800" fill="#c5f8df" font-size="12" font-weight="800" text-anchor="middle">wait F combine: after B attention</text>
    <text x="600" y="840" fill="#9fb4c8" font-size="13" text-anchor="middle">The waits still make reuse safe without preceding independently executable submodules</text>

    <!-- Legend -->
    <line x1="70" y1="890" x2="112" y2="890" stroke="#52d8ff" stroke-width="3" marker-end="url(#fdep)"/>
    <text x="125" y="895" fill="#c8d8e6" font-size="13">Blue: original forward dependency</text>
    <line x1="625" y1="890" x2="667" y2="890" stroke="#b38aff" stroke-width="3" marker-end="url(#bdep)"/>
    <text x="680" y="895" fill="#c8d8e6" font-size="13">Purple: original backward dependency</text>
    <line x1="70" y1="925" x2="112" y2="925" stroke="#ff9366" stroke-width="3" marker-end="url(#risk)"/>
    <text x="125" y="930" fill="#c8d8e6" font-size="13">Orange: premature hand-back</text>
    <line x1="625" y1="925" x2="667" y2="925" stroke="#62dcb0" stroke-width="3" marker-end="url(#ok)"/>
    <text x="680" y="930" fill="#c8d8e6" font-size="13">Green: schedule-aware hand-back</text>
  </g>
</svg>

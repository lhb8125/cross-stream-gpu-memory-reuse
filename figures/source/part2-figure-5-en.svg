<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 718" role="img" aria-labelledby="title desc">
  <title id="title">Dispatch slot count, resident memory, and GPU step time</title>
  <desc id="desc">K equals 1, 2, or 4. Memory increases with slot count. Two slots meet the 0.5 percent performance tolerance and retain dispatch/GEMM overlap while using half the memory of four slots. GPU step time measures one full-iteration CUDA Graph replay.</desc>
  <rect width="1200" height="718" fill="white"/>
  <g font-family="Arial,sans-serif" fill="#182327">
    <text x="55" y="48" font-size="27" font-weight="700">Dispatch slot count, resident memory, and GPU step time</text>
    <text x="55" y="82" font-size="16" fill="#465864">Same-node Nsight Systems measurements; one full-iteration CUDA Graph replay per step</text>
    <text x="55" y="109" font-size="16" fill="#465864">Resident storage = K × 539 MiB. GPU step time excludes host overhead.</text>
    <text x="220" y="158" font-size="20" font-weight="700" fill="#4d8000">Resident dispatch memory</text>
    <text x="730" y="158" font-size="20" font-weight="700" fill="#4d8000">GPU step time</text>

    <text x="70" y="211" font-size="22" font-weight="700">K=1</text>
    <rect x="220" y="185" width="320" height="36" rx="6" fill="#eff6e4"/>
    <rect x="220" y="185" width="80" height="36" rx="6" fill="#76b900"/>
    <text x="558" y="210" font-size="18">539 MiB</text>
    <rect x="730" y="185" width="270" height="36" rx="6" fill="#edf3e7"/>
    <rect x="730" y="185" width="270" height="36" rx="6" fill="#b45309"/>
    <text x="1020" y="210" font-size="18">5,389.290 ms</text>

    <text x="70" y="301" font-size="22" font-weight="700">K=2</text>
    <rect x="220" y="275" width="320" height="36" rx="6" fill="#eff6e4"/>
    <rect x="220" y="275" width="160" height="36" rx="6" fill="#76b900"/>
    <text x="558" y="300" font-size="18">1,078 MiB</text>
    <rect x="730" y="275" width="270" height="36" rx="6" fill="#edf3e7"/>
    <rect x="730" y="275" width="268.0266" height="36" rx="6" fill="#76b900"/>
    <text x="1020" y="300" font-size="18">5,349.900 ms</text>

    <text x="70" y="391" font-size="22" font-weight="700">K=4</text>
    <rect x="220" y="365" width="320" height="36" rx="6" fill="#eff6e4"/>
    <rect x="220" y="365" width="320" height="36" rx="6" fill="#76b900"/>
    <text x="558" y="390" font-size="18">2,156 MiB</text>
    <rect x="730" y="365" width="270" height="36" rx="6" fill="#edf3e7"/>
    <rect x="730" y="365" width="267.7871" height="36" rx="6" fill="#76b900"/>
    <text x="1020" y="390" font-size="18">5,345.120 ms</text>

    <text x="60" y="460" font-size="20" font-weight="700">F dispatch / GEMM overlap</text>
    <rect x="60" y="484" width="340" height="80" rx="12" fill="#fff4e8" stroke="#c47628"/>
    <text x="85" y="516" font-size="18" font-weight="700">K=1</text>
    <text x="230" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#9a4c00">10.956%</text>
    <rect x="430" y="484" width="340" height="80" rx="12" fill="#f2f8e9" stroke="#76b900"/>
    <text x="455" y="516" font-size="18" font-weight="700">K=2</text>
    <text x="600" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#4d8000">77.065%</text>
    <rect x="800" y="484" width="340" height="80" rx="12" fill="#f2f8e9" stroke="#76b900"/>
    <text x="825" y="516" font-size="18" font-weight="700">K=4</text>
    <text x="970" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#4d8000">79.785%</text>

    <rect x="60" y="606" width="1080" height="80" rx="12" fill="#f2f8e9" stroke="#76b900"/>
    <text x="85" y="638" font-size="18" font-weight="700">K=1: step time +0.826% versus K=4; exceeds the 0.5% tolerance.</text>
    <text x="85" y="667" font-size="18" font-weight="700" fill="#4d8000">K=2: step time +0.089%; meets the tolerance with half of K=4's slot memory.</text>
  </g>
</svg>
